# window
remember_window_size                no
initial_window_width                72c
initial_window_height               18c
linux_display_server                auto
confirm_os_window_close              0

# background
# background must match KITTY_BG_COLOR in .bashrc: the fade there pre-renders
# frame_0 as this same tint, so the swap into the animation is seamless.
background                          #151923
background_image                    ~/.config/fastfetch/assets/kitty_wallpaper.png
background_image_layout             scaled
background_tint                     0.6

# remote control (needed to swap background per-app, see .bashrc)
# a dedicated socket (instead of tty-tunneled control) is required for the
# background-fade hook in .bashrc to work reliably when run in the background,
# since tty-tunneled "kitty @" responses race with ble.sh reading the same tty.
allow_remote_control                 yes
listen_on                            unix:@mykitty-{kitty_pid}

